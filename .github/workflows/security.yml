name: CloudGuard Security Validation

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        name: Validate and scan infrastructure
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: pip

            - name: Install analysis tools
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install checkov pytest

            - name: Run Python tests
              run: |
                  python -m pytest -q

            - name: Check Terraform formatting
              uses: hashicorp/setup-terraform@v3

            - name: Verify Terraform formatting
              run: |
                  terraform fmt -check -recursive terraform

            - name: Scan remediated Terraform
              continue-on-error: true
              run: |
                  checkov -d terraform/remediated --output cli

            - name: Scan intentionally insecure baseline
              continue-on-error: true
              run: |
                  checkov -d terraform/insecure --output cli
